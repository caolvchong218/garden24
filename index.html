const held=new Set();

function archive(s){const data=s.snapshot(),i=history.findIndex(h=>h.id===data.id);if(i<0)history.push(data);else history[i]=data;history=history.slice(-100)}
function save(){if(session?.phase==='summary')archive(session);try{localStorage.setItem(STORAGE,JSON.stringify({settings,history,active:session?.snapshot()||null}));storageOK=true}catch{storageOK=false}}
function route(p){if(session&&page==='play')session.pause('离开练习页面，已暂停');page=p;$('#toast').style.display='none';save();render();window.scrollTo(0,0)}
function start(mode,puzzle){if(session){session.finish();archive(session)}session=new Game24.Session(mode,settings,BANK);if(puzzle){session.tickStop();session.acc=0;session.phase='ready';session.used=[];session.next(puzzle)}page='play';review=null;save();render()}

${session&&session.phase!=='summary'?'<div class="notice split"><span>你还有一次练习进度，计时已暂停。</span><button data-action="continue">返回练习</button></div>':''}
<div class="toolbar">${levelControls()}</div>
<div class="cards"><section class="card"><div class="num">∞</div><h2>自由练习</h2><p>按自己的节奏想。每题单独计时，随时跳过，之后还能回来重练。</p><button class="primary" data-action="start" data-mode="free">开始自由练习 →</button></section><section class="card"><div class="num">◷</div><h2>计时挑战</h2><p>一轮 ${settings.roundSize} 题，最多换 ${settings.skipLimit} 次。整轮累计计时，结束后看全部答案并自行核对。</p><button class="primary" data-action="start" data-mode="challenge">开始计时挑战 →</button></section><section class="card"><div class="num">⚑</div><h2>双人抢答</h2><p>同一键盘，两个人比一比。按键抢答，口头说出思路，由老师判断对错。</p><button data-action="start" data-mode="duel">进入双人抢答 →</button></section></div>
<p class="muted subline" style="margin-top:22px">普通题为 4 个 1–9 的数，可重复。入门全程整数；进阶允许正分数；挑战含 1–12 的四数题或 1–9 的五数题。所有模式禁止负数中间结果。</p>`}
function answerBlock(p,open=true){return `<div class="answer"><div class="muted subline">参考答案 · ${p.fractionRequired?'本题必须用到分数中间结果':'本题存在全程整数解法'}</div><div class="formula">${esc(p.answer)}</div><details ${open?'open':''}><summary>分步计算</summary><ol class="steps">${p.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details><div class="muted subline">这是一个合法解法。你的算式形式不同，不代表做错了。</div></div>`}

${duel?`<div class="scoreboard">${[0,1].map(i=>`<div class="team ${i?'orange':''} ${locked&&c.owner===i?'locked':''}"><div><strong><span class="key">${s.settings[i?'keyB':'keyA'].slice(3)}</span>${i?'橙队':'蓝队'}</strong><br><small>本题答错 ${c.errors[i]} / ${s.settings.wrongLimit} 次</small></div><b class="score">${s.scores[i]}</b></div>`).join('')}</div>`:''}
<section class="play"><div class="target">让每个数字恰好用一次，得到 <strong>24</strong></div><div class="numbers ${p.nums.length===5?'five':''}" aria-label="本题数字">${p.nums.map(n=>`<span class="number">${paused?'·':n}</span>`).join('')}</div><div class="status" role="status" aria-live="polite">${esc(status)}</div>
<div class="actions">${paused?'<button class="primary" data-action="resume">继续计时</button>':locked?`<button class="primary" data-action="correct" data-token="${c.lockToken}">答对了 +${s.settings.correctPoints} 分</button><button class="orange" data-action="wrong" data-token="${c.lockToken}">答错了</button>`:ended?'<button class="primary" data-action="next">下一题 →</button>':duel?`<button data-action="buzz" data-player="0">蓝队抢答 · ${s.settings.keyA.slice(3)}</button><button class="orange" data-action="buzz" data-player="1">橙队抢答 · ${s.settings.keyB.slice(3)}</button>`:'<button class="primary" data-action="done">我算出来了</button>'}
${!paused?`<button data-action="answer" ${c.answerVisible?'disabled':''}>看答案${!ended?'（结束本题）':''}</button>`:''}
${!paused&&!ended&&!locked&&!duel?`<button data-action="skip" ${s.mode==='challenge'&&s.skips>=s.settings.skipLimit?'disabled':''}>${s.mode==='challenge'?`换一题（剩 ${s.settings.skipLimit-s.skips} 次）`:'跳过这题 →'}</button>`:''}
${!paused?'<button data-action="pause">暂停</button>':''}</div>${c.answerVisible&&!paused?answerBlock(p):''}</section>
<div class="split" style="margin-top:20px"><span class="muted subline">${duel?`同一玩家在本题累计答错 ${s.settings.wrongLimit} 次，扣 ${s.settings.wrongPenalty} 分并结束本题；对手答错不清零。`:'“我算出来了”仅表示自报完成，系统不会自动判断算式。'}</span><button data-action="finish">结束并看总结</button></div>${s.mode==='challenge'?'<p class="muted subline">换题不计完成，且不重置整轮用时。看答案会占一道正式题并记为未独立完成。题间查看与停留也计入总用时，主动暂停除外。</p>':''}`}
function recordList(records,ownerId){return records.map((r,i)=>{const p=BANK.find(p=>p.id===r.puzzleId);if(!p)return '';return `<article class="record"><div class="record-top"><div><span class="muted subline">第 ${i+1} 次出题 · ${esc(statuses[r.status]||r.status)} · ${time(r.ms)}</span><h3>${p.nums.join('　')}</h3></div><div><label class="visually-hidden" for="check-${esc(r.id)}">本题自评</label><select id="check-${esc(r.id)}" data-check="${esc(r.id)}" data-owner="${esc(ownerId)}"><option value="">选择自评（非自动判定）</option>${[['yes','核对正确'],['no','做错了'],['unsure','还没弄懂']].map(([v,t])=>`<option value="${v}" ${r.selfCheck===v?'selected':''}>${t}</option>`).join('')}</select> <button data-action="retry" data-puzzle="${p.id}">重练</button></div></div>${answerBlock(p,false)}</article>`}).join('')}
function summary(s){const records=s.records,total=typeof s.total==='function'?s.total():s.acc;return `<h1>${labels[s.mode]}总结</h1><p class="muted">逐题看看参考答案，再给自己一个真实的反馈。自评不会变成系统判定的成绩。</p><div class="summary-stats"><div class="stat"><span>总用时</span><b>${time(total)}</b></div><div class="stat"><span>自报完成</span><b>${records.filter(r=>r.status==='self').length}</b></div><div class="stat"><span>直接看答案</span><b>${records.filter(r=>r.status==='viewed').length}</b></div><div class="stat"><span>${s.mode==='challenge'?'换题':'跳过'}</span><b>${records.filter(r=>r.status==='skipped').length}</b></div></div>
${s.mode==='duel'?`<p>蓝队 ${s.scores[0]} 分 · 橙队 ${s.scores[1]} 分</p>`:''}${s.mode==='challenge'?`<p class="muted subline">正式题完成 ${s.completed} / ${s.settings.roundSize}；共出现 ${records.length} 道题（包括被换走的题${records.some(r=>r.status==='unfinished')?'和提前结束的未完成题':''}）。</p>`:''}<div class="actions" style="justify-content:flex-start"><button class="primary" data-action="start" data-mode="${s.mode}">再来一轮</button><button data-action="home">回到开始</button></div><section class="panel" style="margin-top:25px"><h2>全部题目与参考答案</h2>${recordList(records,s.id)||'<p class="muted">还没有完成的题目。</p>'}</section>`}
function historyView(){return `<div class="split"><div><h1>练习记录</h1></div><button class="danger" data-action="clear">清空本地记录</button></div><p class="muted">保留最近 100 次已结束的练习。打开一轮可看全部题目、答案、自评并重练；进行中的练习可从首页返回。</p>${history.length?history.slice().reverse().map(h=>`<div class="panel split" style="margin:15px 0"><div><h3>${labels[h.mode]||'练习'} · ${h.records.length} 道出现题目</h3><div class="muted subline">${esc(h.records[0]?.when?.slice(0,16).replace('T',' ')||'')} UTC · ${time(h.acc)} · ${levels[h.settings?.difficulty]||''}</div></div><button data-action="review" data-id="${esc(h.id)}">查看总结与重练 →</button></div>`).join(''):'<div class="panel empty">还没有已结束的练习。去试一道题吧。</div>'}`}
function settingsView(){return `<h1>设置与规则</h1><p class="muted">设置用于下一次新练习，正在进行的练习保持原有规则。</p><form id="settings-form"><div class="panel settings-grid">${levelControls()}
${selector('roundSize','挑战正式题数',[[5,'5 题 · 短挑战'],[10,'10 题 · 标准挑战'],[15,'15 题'],[20,'20 题'],[30,'30 题']],settings.roundSize)}${selector('skipLimit','挑战最多换题次数',Array.from({length:11},(_,i)=>[i,`${i} 次`]),settings.skipLimit)}
${selector('keyA','蓝队抢答键（字母键）',Array.from({length:26},(_,i)=>['Key'+String.fromCharCode(65+i),String.fromCharCode(65+i)]),settings.keyA)}${selector('keyB','橙队抢答键（字母键）',Array.from({length:26},(_,i)=>['Key'+String.fromCharCode(65+i),String.fromCharCode(65+i)]),settings.keyB)}
${selector('correctPoints','老师判对加分',[1,2,3,4,5].map(i=>[i,`${i} 分`]),settings.correctPoints)}${selector('wrongLimit','同一玩家本题累计几次错误后结束',[1,2,3,4,5].map(i=>[i,`${i} 次`]),settings.wrongLimit)}${selector('wrongPenalty','达到错误次数后扣分',[0,1,2,3,4,5].map(i=>[i,`${i} 分`]),settings.wrongPenalty)}<div style="align-self:end"><button type="submit" class="primary">保存设置</button></div></div></form>
<section class="panel rules"><h2>怎么玩</h2><ol><li>目标为 24。每个给定数字必须恰好使用一次，只用 +、−、×、÷ 和括号，不允许除零，也不允许任何负数中间结果；0 允许。</li><li>普通题为四个 1–9 的数，数字可以重复。入门保证有全程非负整数解法；进阶允许正分数，但“允许”不代表“必须”。参考答案会标明是否必须经过分数。</li><li>挑战为 1–12 的四数题，或 1–9 的五数题。可以选择起步、熟练、深入三个层次。</li><li>自由练习每题计时，可以无限次跳过；跳过不算错。点击“我算出来了”暂停本题计时，仅记自报完成，然后可看答案自行核对。</li><li>计时挑战默认 10 道正式题、可换 3 次。换题不计完成，不重置总计时。直接看答案会结束一道正式题，记为未独立完成。总结包含所有出现过的题目，默认完整一轮最多 13 道。每题思考用时与整轮用时分别记录，题间停留只计入总用时。</li><li>双人先按下的一方锁定，题目计时暂停，口头作答，老师判对或判错。默认答对 +1 分；同一玩家本题累计答错两次扣此人 1 分并结束该题。首次错误恢复计时和抢答；对手的错误不清除另一方的次数。新题双方错误次数归零。</li><li>键盘以浏览器接收到的第一个有效按键事件为准；设备无法真正判定同时按下。长按不会反复抢答，需松开后重新按。离开页面、切换窗口或隐藏标签页会自动暂停，返回后手动继续。</li><li>看答案、结束练习和换题都不会自动判定算式。总结的“核对正确／做错了／还没弄懂”是学生自评。重练从自由练习开始，原记录保留。</li></ol><h3>本地记录</h3><p>不收集姓名、账号或年龄，不接分析服务，不上传练习记录。数据保存在本机浏览器中；清除浏览器数据会删除记录，不同浏览器和网页地址的记录相互独立。每 5 秒保存一次进度；正常离开时也会保存。浏览器禁止本地存储时仍可使用，但关页后记录可能丢失。</p></section>`}
function render(){const app=$('#app');app.innerHTML=(page==='home'?home():page==='play'?play():page==='settings'?settingsView():page==='review'&&review?summary(review):historyView())+(!storageOK?'<div class="notice">本地记录暂时无法保存。当前练习仍可继续，关闭页面可能丢失进度。</div>':'');document.title='24 点小花园 · '+(page==='play'&&session?labels[session.mode]:'让数字开花')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();if(e.detail>1||b.disabled)return;const a=b.dataset.action;if(['home','history','settings'].includes(a))return route(a);if(a==='start')return start(b.dataset.mode);if(a==='continue'){page='play';render();return}if(a==='review'){review=history.find(h=>h.id===b.dataset.id);return route('review')}if(a==='retry'){const p=BANK.find(p=>p.id===b.dataset.puzzle);if(p){const difficulty=p.tiers.beginner?'beginner':p.tiers.advanced?'advanced':'challenge';settings={...settings,difficulty,tier:p.tiers[difficulty]};start('free',p)}return}if(a==='clear'){if(confirm('清空这台浏览器的所有练习记录和当前进度？设置将保留。')){history=[];session=null;save();render()}return}if(!session)return;
if(a==='done')session.done();else if(a==='answer')session.answer();else if(a==='next')session.next();else if(a==='skip')session.skip();else if(a==='pause')session.pause();else if(a==='resume')session.resume();else if(a==='finish')session.finish();else if(a==='buzz')session.lock(Number(b.dataset.player));else if(a==='correct'||a==='wrong')session.judge(a==='correct',b.dataset.token);save();render()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.check){const owner=session?.id===el.dataset.owner?session:history.find(h=>h.id===el.dataset.owner);const r=owner?.records.find(r=>r.id===el.dataset.check);if(r)r.selfCheck=el.value;if(owner&&typeof owner.snapshot==='function'&&owner.phase==='summary')archive(owner);save();return}if(page==='home'&&['difficulty','tier'].includes(el.id)){settings=Game24.normalize({...settings,[el.id]:el.value});save();render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='settings-form')return;e.preventDefault();const values=Object.fromEntries(new FormData(e.target));if(values.keyA===values.keyB)return toast('两位玩家需要不同的抢答键');settings=Game24.normalize(values);save();toast('设置已保存，将用于下一次新练习');render()});
document.addEventListener('keydown',e=>{if(held.has(e.code)||e.repeat)return;held.add(e.code);if(e.ctrlKey||e.altKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(page!=='play'||session?.mode!=='duel')return;const player=e.code===session.settings.keyA?0:e.code===session.settings.keyB?1:-1;if(player>=0){e.preventDefault();if(session.lock(player)){save();render()}}});
document.addEventListener('keyup',e=>held.delete(e.code));
function autoPause(){held.clear();if(session&&page==='play'){if(session.pause('窗口已离开，计时暂停')){save();render()}}}
window.addEventListener('blur',autoPause);document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause()});window.addEventListener('pagehide',()=>{autoPause();save()});
setInterval(()=>{const c=$('#clock');if(c&&session)c.textContent=time(session.mode==='challenge'?session.total():session.phase==='ended'?session.records.at(-1).ms:session.elapsed())},200);setInterval(save,5000);render();
</script></body></html>
